# Auto-provisions the Prometheus datasource on Grafana startup — no manual
# "add datasource" click needed. Reachable at localhost:9090 because both
# containers run with network_mode: host (see ../../docker-compose.yml).

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus_ds     # fixed so the provisioned dashboard JSON can reference it
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: true
