# Scrape config. All targets are on 127.0.0.1 because prometheus runs with
# network_mode: host (see ../docker-compose.yml) and every exporter binds
# loopback-only — nothing here is reachable off the box.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "node-exporter"
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["127.0.0.1:8085"]

  # --- OPTIONAL: the app's own /metrics (inflight requests / "too many users",
  # scan latency, contribution counts) — see MONITORING.md "Wiring up the app
  # target" for how to find the right <address:port> on YOUR server. Uncomment
  # and fill in once you've confirmed it with the discovery recipe there.
  #
  # - job_name: "humanorai-prod"
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["<prod-container-name-or-address>:7860"]
  #
  # - job_name: "humanorai-staging"
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["<staging-container-name-or-address>:7860"]
