# Scrape config. All targets are on 127.0.0.1 because prometheus runs with
# network_mode: host (see ../docker-compose.yml) and every exporter binds
# loopback-only — nothing here is reachable off the box.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "node-exporter"
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["127.0.0.1:8085"]

  # --- The app's own /metrics (inflight requests / "too many users", scan
  # latency, contribution counts). Scraped over the PUBLIC tunnel URL — simplest
  # approach that survives redeploys (the domain is stable, unlike container
  # IPs/names). /metrics is open unless METRICS_TOKEN is set; if you set a token,
  # add it here as `authorization: {credentials: "<token>"}` under the job.
  # NOTE: near-zero until real traffic — scan a few images yourself to see it move.
  - job_name: "humanorai-staging"
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["staging.humanorai.online"]
        labels: {app: "staging"}

  # Prod is served from the master-branch app. It's currently stopped, so this
  # target will show as DOWN until you re-open prod — uncomment then.
  # - job_name: "humanorai-prod"
  #   scheme: https
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["humanorai.online"]
  #       labels: {app: "prod"}
