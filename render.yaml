services:
  - type: web
    name: humanorai-demo
    runtime: python
    plan: free
    branch: master
    buildCommand: python -m pip install -r requirements-runtime.txt
    startCommand: python -m uvicorn demo.api:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: ALLOWED_ORIGIN
        sync: false
      - key: OPENBLAS_NUM_THREADS
        value: '1'
      - key: OMP_NUM_THREADS
        value: '1'
      - key: MKL_NUM_THREADS
        value: '1'
      - key: PYTHONDONTWRITEBYTECODE
        value: '1'
